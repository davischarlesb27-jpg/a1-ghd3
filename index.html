
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HoopLab - Basketball Play Designer</title>

  <style>
    body {
      margin: 0;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
    }

    p {
      color: #b9c6d5;
    }

    #court-container {
      max-width: 850px;
      margin: 25px auto;
      padding: 12px;
    }

    svg {
      width: 100%;
      height: auto;
      border-radius: 12px;
    }

    .player {
      cursor: pointer;
    }

    .player text {
      fill: white;
      font-size: 16px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <h1>HoopLab</h1>
  <p>Interactive Basketball Play Designer</p>

  <div id="court-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

  <script>
    // STEP 1: Create the SVG drawing area
    const svg = d3.select("#court-container")
      .append("svg")
      .attr("viewBox", "0 0 800 650");

    // STEP 2: Draw the basketball court
    svg.append("rect")
      .attr("x", 100)
      .attr("y", 70)
      .attr("width", 600)
      .attr("height", 520)
      .attr("fill", "#e6b879")
      .attr("stroke", "white")
      .attr("stroke-width", 4);

    // Paint / key
    svg.append("rect")
      .attr("x", 302)
      .attr("y", 70)
      .attr("width", 196)
      .attr("height", 230)
      .attr("fill", "#d39b60")
      .attr("stroke", "white")
      .attr("stroke-width", 3);

    // Three-point arc (SVG path)
    svg.append("path")
      .attr("d", "M170 70 L170 216 A230 230 0 0 0 630 216 L630 70")
      .attr("fill", "none")
      .attr("stroke", "white")
      .attr("stroke-width", 3);

    // Free-throw circle
    svg.append("circle")
      .attr("cx", 400)
      .attr("cy", 300)
      .attr("r", 74)
      .attr("fill", "none")
      .attr("stroke", "white")
      .attr("stroke-width", 3);

    // Backboard (line)
    svg.append("line")
      .attr("x1", 365)
      .attr("y1", 112)
      .attr("x2", 435)
      .attr("y2", 112)
      .attr("stroke", "white")
      .attr("stroke-width", 6);

    // Basketball hoop
    svg.append("circle")
      .attr("cx", 400)
      .attr("cy", 132)
      .attr("r", 11)
      .attr("fill", "none")
      .attr("stroke", "#e95f29")
      .attr("stroke-width", 5);

    // Direction marker (polygon)
    svg.append("polygon")
      .attr("points", "390,563 410,563 400,543")
      .attr("fill", "#fff3ce");

    // STEP 3: Store player positions
    const playerData = [
      {id: 1, role: "Point Guard", x: 450, y: 508},
      {id: 2, role: "Shooting Guard", x: 210, y: 390},
      {id: 3, role: "Small Forward", x: 590, y: 390},
      {id: 4, role: "Power Forward", x: 290, y: 485},
      {id: 5, role: "Center", x: 525, y: 450}
    ];

    // STEP 4: Draw players from the data
    const players = svg.selectAll(".player")
      .data(playerData)
      .enter()
      .append("g")
      .attr("class", "player")
      .attr("transform", d => `translate(${d.x}, ${d.y})`);

    players.append("circle")
      .attr("r", 21)
      .attr("fill", "#2563eb")
      .attr("stroke", "white")
      .attr("stroke-width", 2);

    players.append("text")
      .text(d => d.id);

    // Show player's position when hovering
    players.append("title")
      .text(d => d.role);

    // Ball next to the point guard
    svg.append("circle")
      .attr("cx", 480)
      .attr("cy", 508)
      .attr("r", 9)
      .attr("fill", "#f97316")
      .attr("stroke", "#78350f")
      .attr("stroke-width", 2);

  </script>
</body>
</html>
